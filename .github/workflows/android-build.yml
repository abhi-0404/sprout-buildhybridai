# Android build for Sprout, with no Android Studio needed on the laptop.
#
# What it does:
#   1. Builds the web app and copies it into the Capacitor Android project (`cap sync android`).
#   2. Builds a debug APK with Gradle on a free GitHub runner.
#   3. Uploads the APK as a run artifact. On a tag like v0.1.0 it also attaches the APK to a
#      GitHub Release, which gives a stable download link for phones, judges and Appetize.
#
# Firebase: if the GOOGLE_SERVICES_JSON_BASE64 secret and the VITE_* secrets are set, the APK talks to
# the real Firebase project. Without them it still builds and runs in Demo mode.
name: android-build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'sprout/app/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_NATIVE_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sprout/app/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install web dependencies
        working-directory: sprout/app
        run: pnpm install --frozen-lockfile

      - name: Build the web app and sync it into Android
        working-directory: sprout/app
        run: |
          pnpm build
          pnpm exec cap sync android

      - name: Add the Firebase config from a secret (it is gitignored)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > sprout/app/android/app/google-services.json
            echo "Firebase config added."
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret, building in Demo mode."
          fi

      - name: Build the debug APK
        working-directory: sprout/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Sprout-debug.apk"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Sprout-debug-apk
          path: ${{ runner.temp }}/Sprout-debug.apk

      - name: Attach the APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Sprout $GITHUB_REF_NAME" --notes "Debug builds of Sprout. Android: install Sprout-debug.apk."
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Sprout-debug.apk" --clobber
